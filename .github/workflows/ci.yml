name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.14"
          enable-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm run check:bundles
      - run: npm test
      # Herdr generates the SDK locally; type/native checks also run against the installed app.
      - run: git diff --exit-code
