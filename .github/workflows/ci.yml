name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - run: npm ci
      - run: npm run check
      - run: npm test
      # Herdr generates its SDK locally; real SDK type and native checks need Herdr.
      - run: git diff --exit-code
